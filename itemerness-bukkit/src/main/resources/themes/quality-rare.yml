# Rarity ladder tier 3 of 5. Sprites come from tools/generate-tooltip-sprites.py.
schema-version: 1

themes:
  itemerness:quality-rare:
    renderer: native-tooltip-style
    requires-resource-pack: true
    requires-capabilities:
      - itemerness:native-tooltip-style-v1
    vanilla-tooltip-lines: preserve
    fallback: itemerness:vanilla-frame
    tooltip-style: itemerness:quality-rare
    fonts:
      text: itemerness:body
      icons: itemerness:icons
    content:
      minimum-width-pixels: 140
      maximum-width-pixels: 220
      left-padding-pixels: 8
      right-padding-pixels: 8
    styles:
      item-name:
        color: "#6cb8ff"
      label:
        color: "#5a7d9f"
      value:
        color: "#d8ecff"
      requirement-met:
        color: "#8bd17c"
      requirement-unmet:
        color: "#ff6961"
      description:
        color: "#8fadc9"
