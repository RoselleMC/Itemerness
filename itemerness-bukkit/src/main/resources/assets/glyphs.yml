  # Pulls the cursor back over the pixel Minecraft adds past a bitmap glyph's ink. Lives in
  # itemerness:frame rather than itemerness:spacing so a frame row stays a single run.
  frame.kern.minus-one:
    font: itemerness:frame
    codepoint: U+E1FF
    advance-pixels: -1
    visual-bounds: {left: 0, right: 0, top: 0, bottom: 0}

spacing:
  negative:
    font: itemerness:spacing
    codepoint-range:
      first: U+E300
      last: U+E3FF
    minimum-advance-pixels: -256
    maximum-advance-pixels: -1
  positive:
    font: itemerness:spacing
    codepoint-range:
      first: U+E400
      last: U+E4FF
    minimum-advance-pixels: 1
    maximum-advance-pixels: 256
