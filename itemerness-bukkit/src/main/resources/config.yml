# Itemerness configuration
config-version: 3

catalog:
  default-namespace: itemerness

# The desktop editor connects to this plugin's HTTP API. Disabled by default.
# Empty token disables token authentication: anyone who can reach the API can edit drafts.
# Restrict access to trusted networks. To require authentication, use a random token
# of at least 32 characters, or ${ENV_NAME}.
# Listen on all IPv4 interfaces; connect using this server's IP address and API port.
# HTTP is unencrypted. Use HTTPS through a TLS proxy on untrusted networks.
# All editor settings require a restart. Draft saves do not publish the catalog.
# Browser development needs exact allowed origins; the native app does not use CORS.
editor:
  enabled: false
  bind-host: "0.0.0.0"
  port: 18087
  token: ""
  allowed-origins: []

# Canonical state is always direct NBT under minecraft:custom_data.itemerness.
# Canonical Lore is always empty. These invariants are intentionally not configurable.
canonical-item:
  pending-name:
    text: "[{item-id}]"
    color: dark_gray

locale:
  default: en_us

presentation:
  default-layout: itemerness:plain
  default-theme: itemerness:default
