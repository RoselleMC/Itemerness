name: Editor Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "editor/**"
      - "tools/font-metrics/26.1.2.sources.json"
      - "itemerness-bukkit/src/main/resources/META-INF/itemerness/font-metrics/**"
      - ".github/workflows/editor-desktop.yml"

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: rustup update stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @itemerness/web exec playwright install chromium
      - run: pnpm e2e
      - run: pnpm build
      - run: cargo test --locked --manifest-path apps/web/src-tauri/Cargo.toml
      - run: pnpm desktop:build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Itemerness-Editor-${{ matrix.os }}-portable
          path: editor/apps/web/src-tauri/target/release/portable/*
          if-no-files-found: error
