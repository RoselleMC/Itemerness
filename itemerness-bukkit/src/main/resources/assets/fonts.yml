schema-version: 1

measurement:
  client-version: server
  missing-glyph: error
  bold-extra-advance-pixels: 1

fonts:
  minecraft:default:
    metrics: builtin:minecraft-default

  minecraft:uniform:
    metrics: builtin:minecraft-uniform

  itemerness:body:
    metrics: manifest:itemerness-body
    fallback: minecraft:default

  itemerness:icons:
    metrics: explicit
    fallback: minecraft:default

  itemerness:frame:
    metrics: explicit
    fallback: itemerness:icons

  itemerness:canvas:
    metrics: explicit
    fallback: itemerness:icons

  itemerness:spacing:
    metrics: space-provider
    advances:
      minimum: -256
      maximum: 256
      step: 1

tooltip-styles:
  itemerness:ember:
    component-value: itemerness:ember
    expected-background-sprite: itemerness:tooltip/ember_background
    expected-frame-sprite: itemerness:tooltip/ember_frame
    scaling: nine-slice

  itemerness:transparent-canvas:
    component-value: itemerness:transparent-canvas
    expected-background-sprite: itemerness:tooltip/transparent-canvas_background
    expected-frame-sprite: itemerness:tooltip/transparent-canvas_frame
    scaling: stretch
