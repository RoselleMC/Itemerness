schema-version: 1

layouts:
  itemerness:bitmap-canvas:
    renderer: bitmap-canvas
    canvas:
      width-pixels: 176
      height-pixels: 96
      maximum-width-pixels: 220
      maximum-height-pixels: 180
      reserve-tooltip-lines: 10
      clip-policy: reject
    anchors:
      subtitle:
        x: 18
        y: 16
        width: 140
        height: 10
        overflow: ellipsis
      region:
        x: 18
        y: 36
        width: 140
        height: 10
        overflow: ellipsis
      body:
        x: 18
        y: 56
        width: 140
        height: 40
        overflow: ellipsis
    wrapping:
      canvas-body:
        width-pixels: 140
        line-height-pixels: 10
        break-mode: word-then-codepoint
        maximum-lines: 4
        overflow: ellipsis
