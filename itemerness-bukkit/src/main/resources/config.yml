# Itemerness configuration
config-version: 3

catalog:
  default-namespace: itemerness

# Web editor pairing. Leave both empty to disable the editor agent; set both to
# enable server-verified previews. Managed publication is not available yet.
# Setting only one is a configuration error rather than a silent fallback. The
# plugin dials out over TLS, so no inbound port is needed.
# Changing either pairing value while the server is running requires a restart.
# A ${ENV_NAME} value is read from the environment, which keeps the token out of
# this file. Tokens are never logged, exported, or returned in diagnostics.
editor:
  url: ""
  token: ""

# Canonical state is always direct NBT under minecraft:custom_data.itemerness.
# Canonical Lore is always empty. These invariants are intentionally not configurable.
canonical-item:
  pending-name:
    text: "[{item-id}]"
    color: dark_gray

locale:
  default: en_us

presentation:
  default-layout: itemerness:plain
  default-theme: itemerness:default
