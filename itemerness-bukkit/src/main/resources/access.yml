config-version: 1

# API callers are bound by Bukkit identity, lifecycle generation and caller class loader before
# these cooperative governance grants are evaluated.
api:
  defaults:
    identify: allow
    create: allow
    read-data: schema-policy
    edit-data: deny
    write-viewer-fact: deny
    request-refresh: allow

  grants: []

# Grant examples belong in the integration documentation. This local trust file
# is never supplied or changed by the remote editor.
