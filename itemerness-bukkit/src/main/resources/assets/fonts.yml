schema-version: 1

measurement:
  client-version: server
  missing-glyph: error
  bold-extra-advance-pixels: 1

fonts:
  minecraft:default:
    metrics: builtin:minecraft-default

  minecraft:uniform:
    metrics: builtin:minecraft-uniform

  itemerness:body:
    metrics: manifest:itemerness-body
    fallback: minecraft:default

  itemerness:icons:
    metrics: explicit
    fallback: minecraft:default

  itemerness:frame:
    metrics: explicit
    fallback: itemerness:icons

  itemerness:canvas:
    metrics: explicit
    fallback: itemerness:icons

  itemerness:spacing:
    metrics: space-provider
    advances:
      minimum: -256
      maximum: 256
      step: 1

tooltip-styles:
  itemerness:ember:
    component-value: itemerness:ember
    expected-background-sprite: itemerness:tooltip/ember_background
    expected-frame-sprite: itemerness:tooltip/ember_frame
    scaling: nine-slice

  itemerness:transparent-canvas:
    component-value: itemerness:transparent-canvas
    expected-background-sprite: itemerness:tooltip/transparent-canvas_background
    expected-frame-sprite: itemerness:tooltip/transparent-canvas_frame
    scaling: stretch

  # Rarity ladder. Sprites come from tools/generate-tooltip-sprites.py.
  itemerness:quality-common:
    component-value: itemerness:quality-common
    expected-background-sprite: itemerness:tooltip/quality-common_background
    expected-frame-sprite: itemerness:tooltip/quality-common_frame
    scaling: nine-slice

  itemerness:quality-uncommon:
    component-value: itemerness:quality-uncommon
    expected-background-sprite: itemerness:tooltip/quality-uncommon_background
    expected-frame-sprite: itemerness:tooltip/quality-uncommon_frame
    scaling: nine-slice

  itemerness:quality-rare:
    component-value: itemerness:quality-rare
    expected-background-sprite: itemerness:tooltip/quality-rare_background
    expected-frame-sprite: itemerness:tooltip/quality-rare_frame
    scaling: nine-slice

  itemerness:quality-epic:
    component-value: itemerness:quality-epic
    expected-background-sprite: itemerness:tooltip/quality-epic_background
    expected-frame-sprite: itemerness:tooltip/quality-epic_frame
    scaling: nine-slice

  itemerness:quality-legendary:
    component-value: itemerness:quality-legendary
    expected-background-sprite: itemerness:tooltip/quality-legendary_background
    expected-frame-sprite: itemerness:tooltip/quality-legendary_frame
    scaling: nine-slice
